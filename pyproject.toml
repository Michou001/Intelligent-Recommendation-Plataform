[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-platform"
version = "0.2.0"
description = "Intelligent Recommendation Platform - Milestone 2 implementation of the layered architecture proposal"
requires-python = ">=3.11"
readme = "README.md"

# Runtime stack of Table 7 (Section 9.1). Every dependency is justified by a
# component that consumes it; nothing is listed that no module imports.
dependencies = [
    "fastapi>=0.110",          # Application/Controller Layer
    "uvicorn>=0.27",           # ASGI server for the Application/Controller Layer
    "pydantic>=2.6",           # Request/response contracts and Fail Fast validation
    "numpy>=1.26",             # PopularityStrategy, vectorised Top-K selection
    "pandas>=2.2",             # Feature Store and offline pipeline
    "pyarrow>=15.0",           # Apache Parquet backend of the Feature Store
    "scikit-learn>=1.4",       # ContentBasedStrategy similarity utilities
    "structlog>=24.1",         # Operational logging emitted by the decorators
    "SQLAlchemy>=2.0",         # SqlUserProfileRepository / SqlCatalogRepository
]

[project.optional-dependencies]
# Optional backends. Each one has an in-process fallback behind the same
# interface, so the system runs without external infrastructure (Section 9.8).
als = ["implicit>=0.7"]                        # CollaborativeFilteringStrategy
deep = ["torch>=2.2"]                          # DeepLearningStrategy
content = ["sentence-transformers>=2.5"]       # ContentBasedStrategy embeddings
cache = ["redis>=5.0"]                         # CachingDecorator backend
broker = ["pika>=1.3"]                         # InteractionEventQueue backend
nosql = ["pymongo>=4.6"]                       # NoSqlInteractionHistoryRepository
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.3", "black>=24.2", "mypy>=1.9"]

[project.scripts]
reco-pipeline = "data.pipeline.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["errors"]

[tool.setuptools.packages.find]
where = ["src"]

# The Presentation Layer page ships with the package, so an installed build
# serves the same interface as a source checkout.
[tool.setuptools.package-data]
presentation = ["static/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["N818"]  # exception names follow Table 10 verbatim, not the *Error suffix rule

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The strategy imports sit at the bottom of the package on purpose: they are
# what populates the registry, and they must run after the shared loader is
# defined (see the module docstring).
"src/ai/strategies/__init__.py" = ["E402"]
# Depends() in a parameter default is the FastAPI dependency-injection idiom,
# not an accidental call in a default argument.
"src/application/api.py" = ["B008"]

[tool.mypy]
# No python_version pin: the installed numpy ships stubs that use 3.12+ syntax,
# so pinning the check to 3.11 aborts before it reaches this project's code.
# The source targets 3.11 (requires-python above); mypy checks it against the
# interpreter in use. See IMPLEMENTATION_NOTES.md.
mypy_path = "src"
packages = ["ai", "application", "config", "data", "messaging", "persistence", "presentation"]
disallow_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
